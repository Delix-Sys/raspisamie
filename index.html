s();$('group').innerHTML=gs.map(g=>`<option>${g}</option>`).join('');render()}function card(l,t,current){if(!l)return `<div class="card free"><div class="ct">${t}</div><div class="subject">Свободно</div><div class="details">Нет пары</div></div>`;let on=l.type==='online';return `<div class="card ${on?'online':''} ${current?'current':''}"><div class="ct">${t}${current?' <span class="now">СЕЙЧАС</span>':''}</div><div class="subject">${esc(l.subject)}</div><div class="details">${esc(l.teacher||'')}${l.teacher&&l.room?' • ':''}${esc(on?'Дистанционно':(l.room||''))}</div></div>`}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){
  let wk=DATA.weeks[$('week').value],
      g=$('group').value,
      d=wk.groups[g]||{},
      ts=times(),
      slot=currentSlot(),
      now=new Date(),
      di=now.getDay()-1,
      currentDay=di>=0&&di<6?DAYS[di]:null;

  let h=`<div class="head" style="background:#e9f8ee;border-color:#34c759;color:#24963f">ВРЕМЯ</div>`;
  DAYS.forEach((day,i)=>h+=`<div class="head">${day}<small>${SHORT[i]}</small></div>`);

  let body='';

  for(const t of ts){
    body+=`<div class="time">${t}</div>`;

    for(const day of DAYS){
      let dayLessons=d[day]||[];
      let ls=dayLessons.filter(x=>x.time===t);

      // Первая пара с пустым временем → 08:15-09:45
      if(t==='08:15-09:45'){
        let empty=dayLessons.filter(x=>!x.time);
        if(empty.length) ls=empty.slice(0,2);
      }

      let cur=currentDay===day&&slot===t;

      body+=`<div class="cell">${
        ls.length
          ? ls.slice(0,2).map(x=>card(x,t,cur)).join('')
          : card(null,t,false)
      }</div>`;
    }
  }

  $('board').innerHTML=h+body;
  $('status').textContent=`${g} • ${$('week').value} • ${wk.period}`;
}
